rules:
  - id: raptor.crypto.weak-hash.java
    message: Weak hash function detected. Use SHA-256 or better. Verify migration and test vectors.
    languages: [java, kotlin]
    severity: HIGH
    pattern-either:
      # MD2 (RFC 6149) and MD4 (RFC 6150) are strictly weaker than the
      # MD5 already listed; MD2 is a standard JCA algorithm name and
      # MD4 is provider-registered (e.g. BouncyCastle). Set kept
      # consistent with the config-resolved channel's weak-hash set.
      - pattern: MessageDigest.getInstance("MD2")
      - pattern: MessageDigest.getInstance("MD4")
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA1")
      - pattern: MessageDigest.getInstance("SHA-1")
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V3.9"]

  - id: raptor.crypto.weak-hash.python
    message: Weak hash function detected. Use SHA-256 or better. Verify migration and test vectors.
    languages: [python]
    severity: HIGH
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V3.9"]

  - id: raptor.crypto.weak-hash.go
    message: Weak hash function detected. Use SHA-256 or better. Verify migration and test vectors.
    languages: [go]
    severity: HIGH
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V3.9"]
