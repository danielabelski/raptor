rules:
  - id: raptor.files.path_traversal.java
    message: Java file construction from potentially unvalidated input; canonicalise and validate inputs.
    languages: [java, kotlin]
    severity: HIGH
    patterns:
      - pattern: new File($USERINPUT)
      - pattern-not: new File("...")
    metadata:
      cwe: ["CWE-22"]

  - id: raptor.files.path_traversal.python
    message: Python open() with concatenated user input; canonicalise and validate inputs.
    languages: [python]
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: open($USERINPUT + "/" + $REST)
          - pattern: open(os.path.join($USERINPUT, $REST))
      - pattern-not: open("..." + "/" + $REST)
      - pattern-not: open(os.path.join("...", $REST))
    metadata:
      cwe: ["CWE-22"]

  - id: raptor.files.path_traversal.js
    message: JavaScript path construction from user input; validate or normalise paths.
    languages: [javascript, typescript]
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: fs.openSync($USERINPUT + "/" + $REST, ...)
          - pattern: fs.readFileSync(path.join($USERINPUT, $REST), ...)
      - pattern-not: fs.openSync("..." + "/" + $REST, ...)
      - pattern-not: fs.readFileSync(path.join("...", $REST), ...)
    metadata:
      cwe: ["CWE-22"]

  - id: raptor.files.path_traversal.taint.python
    message: Untrusted data reaches filesystem path operations. Validate or canonicalise the path.
    languages: [python]
    severity: CRITICAL
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET[$_]
          - pattern: request.POST[$_]
          - pattern: flask.request.args[$_]
          - pattern: flask.request.form[$_]
          - pattern: input(...)
    pattern-sinks:
      # os.path.join is deliberately not a sink here —
      # raptor.python.path-join-traversal owns that shape with the
      # correct focus on the joined component.
      - pattern-either:
          - pattern: open($PATH, ...)
          - pattern: os.open($PATH, ...)
          - pattern: Path($PATH)
    # No abspath/resolve sanitizers: both NORMALISE the path — they
    # resolve "../" so the escape takes effect, they do not confine
    # it. basename genuinely confines (strips directory components).
    pattern-sanitizers:
      - pattern: os.path.basename(...)
    metadata:
      cwe: ["CWE-22"]
